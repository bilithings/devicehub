user  nginx;
worker_processes  1;

error_log   /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

  log_format devicehub '$time_iso8601 $remote_addr "$request" status=$status bytes=$body_bytes_sent request_id=$http_x_request_id trace_id=$http_x_trace_id session_id=$http_x_session_id upstream_status=$upstream_status upstream_addr=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';
  access_log /var/log/nginx/access.log devicehub;

  # Docker's embedded DNS. valid=10s forces re-resolution so a rebuilt
  # container's new IP is picked up without restarting Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;

  server {
    listen 80;
    listen 443 ssl;
    server_name nginx;

    # Certificates (default are generated by omgwtfssl)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-SHA';
    ssl_prefer_server_ciphers on;

    client_max_body_size 1024M;

    # Variable upstreams are resolved at request time through the resolver
    # above, never cached for the lifetime of the worker process.
    set $app_upstream devicehub-app:3000;
    set $api_upstream devicehub-api:3000;
    set $auth_upstream devicehub-auth:3000;
    set $websocket_upstream devicehub-websocket:3000;
    set $storage_temp_upstream devicehub-storage-temp:3000;
    set $storage_apk_upstream devicehub-storage-plugin-apk:3000;
    set $storage_image_upstream devicehub-storage-plugin-image:3000;

    location = /auth {
      proxy_pass http://$app_upstream;
    }

    # Use this if you have provider is in the docker network.
    # WARNING: This allows direct access to any host in the network. Use with caution.
    location ~ ^/d/(?<stfprovider>[^/]+)/(?<port>[0-9]+)/$ {
        proxy_pass http://$stfprovider:$port/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header X-Session-ID $http_x_session_id;
        # The port identifies one specific device worker: never retry
        # against another upstream.
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /auth/ {
      proxy_pass http://$auth_upstream;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Trace-ID $http_x_trace_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Trace-ID $http_x_trace_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /s/image/ {
      proxy_pass http://$storage_image_upstream;
    }

    location /s/apk/ {
      proxy_pass http://$storage_apk_upstream;
    }

    location /s/ {
      client_max_body_size 2048m;
      client_body_buffer_size 128k;
      proxy_pass http://$storage_temp_upstream;
    }

    location /socket.io/ {
      proxy_pass http://$websocket_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Trace-ID $http_x_trace_id;
      proxy_set_header X-Session-ID $http_x_session_id;
    }

    location / {
      proxy_pass http://$app_upstream;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Trace-ID $http_x_trace_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
